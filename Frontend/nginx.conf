server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own default (1m) is too small for the Dashboard's image
    # uploads (Services/Projects/News/Homepage photos via multipart PATCH
    # through /api/) — raised sitewide rather than scoped to /api/ alone,
    # since it costs nothing on routes that never receive a body this big.
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
        image/svg+xml font/woff2 font/woff;

    # Vite's own JS/CSS bundles are content-hashed in their filenames — safe
    # to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/fonts — Protocol 1's WOFF2/WOFF files, filenames are stable and
    # never change without a filename change.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/media — Protocol 7's generated AVIF/WebP derivatives. Filenames
    # are stable per source image but content can change on a rebuild, so
    # this is cached but revalidated rather than marked immutable.
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    # Reverse proxy to the real Dashboard API backend. Replaces the Vercel
    # Serverless Function (api/proxy.js) that role played on Vercel — nginx
    # can proxy the real /api/... path directly, so no query-param rewrite
    # trick is needed here (see src/app/dashboard/services/client.ts).
    #
    # The backend's session/CSRF cookies are SameSite=Lax, so this proxy
    # keeps every request same-site from the browser's point of view. Origin
    # is rewritten to the backend's own origin because Django's CSRF
    # middleware compares Origin against Host and rejects a mismatch on any
    # session-authenticated write — the same fix already proven in this
    # project's local dev proxy (vite.config.ts) and the old Vercel proxy.
    location /api/ {
        proxy_pass https://apisorouh.trycvision.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host apisorouh.trycvision.com;
        proxy_set_header Origin https://apisorouh.trycvision.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_flags ~ secure samesite=lax;
    }

    # Never cache the HTML entry point — it references the current hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback so client-side routes (react-router) survive a hard
    # refresh or a direct link, e.g. /about, /projects, /dashboard/services.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
