services:
  - type: web
    name: al-souroh-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py setup_admins && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: al-souroh-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://al-souroh.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      # Neon.tech Postgres connection string (permanent — unlike Render's
      # own free Postgres, which auto-deletes after 30 days). Filled in
      # during Blueprint setup, not stored in this file.
      - key: DATABASE_URL
        sync: false
      # Backblaze B2 (S3-compatible) bucket for uploaded media — see
      # core/settings.py's USE_S3 block. All filled in during setup.
      - key: USE_S3
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      # Optional: auto-create admin logins on every deploy (see
      # general_information/management/commands/setup_admins.py). Leave
      # blank in the dashboard to skip.
      - key: DEV_SUPERUSER_USERNAME
        sync: false
      - key: DEV_SUPERUSER_EMAIL
        sync: false
      - key: DEV_SUPERUSER_PASSWORD
        sync: false
      - key: CLIENT_ADMIN_USERNAME
        sync: false
      - key: CLIENT_ADMIN_EMAIL
        sync: false
      - key: CLIENT_ADMIN_PASSWORD
        sync: false
